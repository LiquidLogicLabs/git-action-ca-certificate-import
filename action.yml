name: 'CA Certificate Import'
description: 'Install custom SSL/TLS certificates for build environments'
author: 'LiquidLogicLabs'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  certificate:
    description: |
      Certificate source: auto-detects file path, URL, or inline content.
      - URL: starts with http:// or https:// (e.g., 'https://pki.company.com/ca.crt')
      - File path: relative or absolute path to certificate file (e.g., 'certs/ca.crt')
      - Inline: contains -----BEGIN CERTIFICATE----- markers (e.g., from secrets)
    required: true
  
  certificate-name:
    description: 'Name for the certificate file (auto-generated if not specified)'
    required: false
    default: ''
  
  verbose:
    description: 'Enable verbose debug logging. Also enabled when ACTIONS_STEP_DEBUG=true.'
    required: false
    default: 'false'
  
  generate-buildkit:
    description: 'Generate buildkit.toml configuration file with CA certificate settings'
    required: false
    default: 'false'

  buildkit-registries:
    description: |
      Registry host(s) BuildKit must trust the CA for, used when generate-buildkit is true.
      Newline- or comma-separated host[:port] values (e.g. 'registry.example.com:5000').
      Each gets its own [registry."<host>"] table; BuildKit has no wildcard host.
      If empty, the legacy file is generated with a warning: BuildKit ignores its keys and does not trust the CA.
    required: false
    default: ''
  
  buildkit-runtime:
    description: 'Container runtime for BuildKit (e.g., "io.containerd.runc.v2"). Leave empty to omit runtime configuration'
    required: false
    default: ''

  skip-certificate-check:
    description: 'Skip TLS certificate verification when downloading certificates from URLs'
    required: false
    default: 'false'

outputs:
  certificate-path:
    description: 'Path where the certificate was installed'
    value: ${{ steps.install-cert.outputs.certificate-path }}
  
  certificate-name:
    description: 'Name of the installed certificate file'
    value: ${{ steps.install-cert.outputs.certificate-name }}
  
  buildkit-path:
    description: 'Path to the generated buildkit.toml file (only set if generate-buildkit is true)'
    value: ${{ steps.install-cert.outputs.buildkit-path }}

runs:
  using: 'composite'
  steps:
    - name: Install certificate
      id: install-cert
      shell: bash
      # github.action_path goes through env: rather than being expanded into the run:
      # block. Expanded inline it is substituted as literal text before bash parses the
      # line, so any shell metacharacter (a space in the checkout path is enough) changes
      # what runs. zizmor flags this one only under --persona=auditor, but the rule is the
      # same: an expression never reaches a run: block directly.
      run: "$Z_ACTION_PATH/install-certificate.sh"
      env:
        Z_ACTION_PATH: ${{ github.action_path }}
        INPUT_CERTIFICATE: ${{ inputs.certificate }}
        INPUT_CERTIFICATE_NAME: ${{ inputs.certificate-name }}
        INPUT_VERBOSE: ${{ inputs.verbose == 'true' || env.ACTIONS_STEP_DEBUG == 'true' }}
        INPUT_GENERATE_BUILDKIT: ${{ inputs.generate-buildkit }}
        INPUT_BUILDKIT_RUNTIME: ${{ inputs.buildkit-runtime }}
        INPUT_BUILDKIT_REGISTRIES: ${{ inputs.buildkit-registries }}
        INPUT_SKIP_CERTIFICATE_CHECK: ${{ inputs.skip-certificate-check }}

