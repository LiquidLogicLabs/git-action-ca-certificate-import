name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Semver tags only
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string


concurrency:
  # Same group for same release whether triggered by push (tag) or workflow_dispatch (inputs.tag)
  group: ${{ github.workflow || 'Release' }}-${{ github.event.inputs.tag || github.ref_name || github.ref || github.run_id }}
  cancel-in-progress: false

# Floor for every job in this file. Deleting this block would NOT narrow anything -- jobs
# would fall back to the repository default, which may be write-all.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    # `$/` is GitHub syntax from July 2026 and act 0.2.89 rejects it outright ("must start
    # with './' if it's a local workflow"), which would break every `npm run test:act:*`
    # script here. The marker must sit ON the uses: line -- a comment above a JOB-level
    # uses: is not honoured, unlike the step-level case.
    uses: ./.github/workflows/test.yml  # zizmor: ignore[self-repository]
    # No `secrets:` block: test.yml reads no secret at all -- its only external value is
    # `vars.TEST_CERTIFICATE_URL`, which reaches a called workflow in the same repository
    # without being passed.
    # test.yml runs: all tests for composite action

  release:
    permissions:
      contents: write   # creates the release and moves the floating tags
    needs: test  # REQUIRED: Tests must pass before release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked] — the floating-tags step later in this job
        # force-pushes vX/vX.Y using these persisted credentials; disabling them
        # breaks the release, and only at release time.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0  # Full history for changelog generation
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse and validate version tag
        id: version
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        #
        # Repository renamed: git-tag-validate-version-action now redirects to
        # git-action-tag-validate-version. GitHub serves the redirect today, but a
        # redirect is not a guarantee -- the old name can be re-registered by anyone
        # once it is freed, which turns this line into a third-party action.
        uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          version-type: 'auto'

      - name: Build validation
        env:
          Z_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          Z_SHA: ${{ github.sha }}
          Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          Z_RUNNER_OS: ${{ runner.os }}
          Z_VERSION_OUTPUTS_HAS_PRERELEASE_TRUE: ${{ steps.version.outputs.has-prerelease == 'true' }}
        run: |
          echo "🔨 Validating action before release..."
          
          # Validate action.yml
          if [ -f "action.yml" ]; then
            echo "✓ action.yml found"
          else
            echo "✗ action.yml not found"
            exit 1
          fi
          
          # Validate install script
          if [ -f "install-certificate.sh" ]; then
            echo "✓ install-certificate.sh found"
            chmod +x install-certificate.sh
            
            # Test script syntax
            bash -n install-certificate.sh
            echo "✓ install-certificate.sh syntax valid"
          else
            echo "✗ install-certificate.sh not found"
            exit 1
          fi
          
          # Create package manifest with release version.
          # is_prerelease stays UNQUOTED on purpose: it is a JSON boolean, and quoting it
          # would emit the string "true". Inside a heredoc a bare ${VAR} is not word-split,
          # so the usual reason to quote does not apply here.
          cat > package-manifest.json << EOF
          {
            "name": "ca-certificate-import-action",
            "version": "${Z_VERSION_OUTPUTS_VERSION}",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_sha": "${Z_SHA}",
            "git_ref": "${Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME}",
            "platform": "${Z_RUNNER_OS}",
            "is_prerelease": ${Z_VERSION_OUTPUTS_HAS_PRERELEASE_TRUE}
          }
          EOF
          
          echo "📦 Package manifest created:"
          cat package-manifest.json

      - name: Verify tracked scripts are unchanged
        run: |
          if ! git diff --quiet -- action.yml install-certificate.sh; then
            echo "::error::action.yml or install-certificate.sh changed during validation."
            git diff --stat -- action.yml install-certificate.sh
            exit 1
          fi
          echo "Tracked scripts verified."

      - name: Generate release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6
        with:
          mode: "HYBRID"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Pull Requests</summary>\n\n#{{PR_LIST}}\n</details>\n\n---\n\n### Usage\n\n```yaml\n- uses: LiquidLogicLabs/git-action-ca-certificate-import@${{ github.ref_name }}\n  with:\n    certificate: 'path/to/cert.crt'  # Auto-detects: file path, URL, or inline content\n```\n\n### Installation\n\nThe certificate will be installed to the system CA store and trusted by:\n- ✅ Docker (push/pull from registries with custom certs)\n- ✅ curl, wget, and other HTTP clients\n- ✅ pip, npm, apt, and other package managers\n- ✅ Git operations over HTTPS\n- ✅ Any tool that uses the system CA store"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Major and Minor Version Tags
        if: steps.version.outputs.has-prerelease != 'true' && steps.version.outputs.is-valid == 'true'
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-tag-floating-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          # Without this the minor tag (vX.Y) is never moved: the action defaults it to
          # false, so every repo left vX.Y frozen at an old release while the summary
          # below claimed it had been created.
          update-minor: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-release@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.has-prerelease == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          Z_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          Z_REPOSITORY: ${{ github.repository }}
          Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          Z_VERSION_OUTPUTS_HAS_PRERELEASE: ${{ steps.version.outputs.has-prerelease }}
          Z_VERSION_OUTPUTS_MAJOR: ${{ steps.version.outputs.major }}
          Z_VERSION_OUTPUTS_MINOR: ${{ steps.version.outputs.minor }}
          Z_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## 🎉 Release Complete!"
            echo ""
            echo "- **Version**: ${Z_VERSION_OUTPUTS_VERSION}"
            echo "- **GitHub Release**: [View Release](https://github.com/${Z_REPOSITORY}/releases/tag/${Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME})"
            if [ "${Z_VERSION_OUTPUTS_HAS_PRERELEASE}" == "true" ]; then
              echo "- **Status**: ⚠️ Pre-release (for testing)"
            else
              echo "- **Status**: ✅ Stable release"
              echo "- **Version Tags Created**: \`@v${Z_VERSION_OUTPUTS_MAJOR}\`, \`@v${Z_VERSION_OUTPUTS_MAJOR}.${Z_VERSION_OUTPUTS_MINOR}\`, \`@${Z_REF_NAME}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

