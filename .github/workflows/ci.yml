name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: ['**']
    tags-ignore: ['**']  # Ignore tag pushes (handled by release workflow)
  pull_request:
    paths-ignore: ['**/*.md']
    branches: ['**']
  workflow_call:  # Allow CI to be called by release workflow
  workflow_dispatch:  # Allow manual triggering


concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false
          fetch-depth: 0

      - name: Validate action.yml
        run: |
          if [ -f "action.yml" ]; then
            echo "✓ action.yml found"
          else
            echo "✗ action.yml not found"
            exit 1
          fi

      - name: Validate shell script syntax
        run: |
          if [ -f "install-certificate.sh" ]; then
            chmod +x install-certificate.sh
            bash -n install-certificate.sh
            echo "✓ install-certificate.sh syntax valid"
          else
            echo "✗ install-certificate.sh not found"
            exit 1
          fi

      - name: Reject duplicate forge workflow directories
        run: |
          # Gitea Actions runs .github/workflows/ — verified against a Gitea-hosted repo in
          # this set that has no .gitea/ directory and whose jobs run there successfully.
          # A second copy is not needed, and the one that existed had drifted badly: it had
          # missed every CI gate added to .github/, and all the defects found in this repo
          # set lived in it, because it is the copy no linter or scanner reads.
          # If a forge genuinely needs its own workflow, get that approved and add the
          # directory to the allowlist below with the reason.
          found=""
          for d in .gitea .forgejo .circleci .drone .woodpecker; do
            [ -e "$d" ] && found="$found $d"
          done
          if [ -n "$found" ]; then
            echo "::error::Duplicate forge workflow directory present:$found"
            echo "::error::.github/workflows/ is the single source for every forge."
            echo "::error::If this is deliberate, record the approved reason and amend this check."
            exit 1
          fi
          echo "No duplicate forge workflow directories."
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # No path: actionlint discovers every workflow itself. Passing a directory makes
          # it fail with "is a directory" and exit 0, having linted nothing -- and passing
          # one file, as this did, left release.yml and test.yml unchecked, which is where
          # nearly all the shell actually lives.
          args: -color

      - name: Audit workflows for injection and supply-chain issues
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/zizmorcore/zizmor:1.30.0 \
            --no-progress --persona=regular /repo

      - name: Reject a suppressed template-injection finding
        run: |
          # template-injection is the remote-code-execution class this gate exists for. It
          # may never be suppressed -- neither inline nor through a config file that a
          # reviewer scanning workflow diffs would not see.
          if grep -rn 'zizmor: ignore\[template-injection\]' .github action.yml 2>/dev/null; then
            echo "::error::template-injection may not be suppressed; fix it or report blocked"
            exit 1
          fi
          for cfg in .github/zizmor.yml .github/zizmor.yaml zizmor.yml .zizmor.yml; do
            if [ -e "$cfg" ]; then
              echo "::error::$cfg would let findings be silenced outside the workflow diff"
              exit 1
            fi
          done
          echo "No suppressed template-injection findings and no zizmor config."

      - name: Scan for secrets
        run: |
          # Fail loudly if the mount is not a git repo — gitleaks exits 0 in that case.
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.30.1 \
            -c 'test -e /repo/.git' || { echo "::error::gitleaks mount is not a git repo"; exit 1; }
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact

  test:
    needs: validate  # Tests run after validation
    # `$/` is GitHub syntax from July 2026 and act 0.2.89 rejects it outright ("must start
    # with './' if it's a local workflow"), which would break every `npm run test:act:*`
    # script here. The marker must sit ON the uses: line -- a comment above a JOB-level
    # uses: is not honoured, unlike the step-level case.
    uses: ./.github/workflows/test.yml  # zizmor: ignore[self-repository]
    # No `secrets:` block: test.yml reads no secret at all. Its only external value is
    # `vars.TEST_CERTIFICATE_URL`, and the `vars` context reaches a called workflow in the
    # same repository without being passed. `secrets: inherit` handed it every repository
    # secret for nothing.
    # test.yml runs: all tests for composite action