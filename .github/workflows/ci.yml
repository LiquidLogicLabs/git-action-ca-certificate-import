name: CI

on:
  push:
    paths-ignore: ['**/*.md']
    branches: ['**']
    tags-ignore: ['**']  # Ignore tag pushes (handled by release workflow)
  pull_request:
    paths-ignore: ['**/*.md']
    branches: ['**']
  workflow_call:  # Allow CI to be called by release workflow
  workflow_dispatch:  # Allow manual triggering


concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate action.yml
        run: |
          if [ -f "action.yml" ]; then
            echo "✓ action.yml found"
          else
            echo "✗ action.yml not found"
            exit 1
          fi

      - name: Validate shell script syntax
        run: |
          if [ -f "install-certificate.sh" ]; then
            chmod +x install-certificate.sh
            bash -n install-certificate.sh
            echo "✓ install-certificate.sh syntax valid"
          else
            echo "✗ install-certificate.sh not found"
            exit 1
          fi

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/ci.yml

      - name: Scan for secrets
        run: |
          # Fail loudly if the mount is not a git repo — gitleaks exits 0 in that case.
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.30.1 \
            -c 'test -e /repo/.git' || { echo "::error::gitleaks mount is not a git repo"; exit 1; }
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact

  test:
    needs: validate  # Tests run after validation
    uses: ./.github/workflows/test.yml
    secrets: inherit
    # test.yml runs: all tests for composite action